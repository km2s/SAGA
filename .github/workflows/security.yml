name: Security & Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security:
    name: Security Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies (moderate+)
        run: pnpm audit --audit-level moderate

      - name: TypeScript check (web)
        run: pnpm --filter web exec tsc --noEmit

      - name: TypeScript check (bot)
        run: pnpm --filter bot exec tsc --noEmit

      - name: Build (web)
        run: pnpm --filter web build
        env:
          # Valores fictícios para o build CI — não são credenciais reais
          NEXTAUTH_SECRET: ci-secret-placeholder-32-chars-long!!
          NEXTAUTH_URL: http://localhost:3000
          DISCORD_CLIENT_ID: ci_client_id
          DISCORD_CLIENT_SECRET: ci_client_secret
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
